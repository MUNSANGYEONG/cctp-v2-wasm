[package]
name = "cctp-v2-forward-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []

[dependencies]
cosmwasm-schema = "1.5.8"
cosmwasm-std = { version = "1.5.8", features = ["staking", "stargate"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
base64ct = "=1.6.0"
hex = "0.4.3"
schemars = "0.8.21"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
thiserror = "2.0.11"
