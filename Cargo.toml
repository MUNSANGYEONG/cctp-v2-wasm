[workspace]
members = ["contracts/*", "packages/*"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
cosmwasm-schema = "1.5.8"
# cosmwasm_1_2 enables instantiate2 (WasmMsg::Instantiate2, instantiate2_address,
# query_wasm_code_info) required by the factory for deterministic forwarder addresses.
cosmwasm-std = { version = "1.5.8", features = ["staking", "stargate", "cosmwasm_1_2"] }
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
cw-utils = "1.0.3"
base64ct = "=1.6.0"
hex = "0.4.3"
schemars = "0.8.21"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
thiserror = "2.0.11"
# cosmwasm_1_2 feature enables the CodeInfo query (query_wasm_code_info) and
# instantiate2 support in the test harness, matching the contracts' runtime needs.
cw-multi-test = { version = "1.2.0", features = ["cosmwasm_1_2"] }

forwarder-factory-shared = { path = "packages/shared" }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
overflow-checks = true
panic = "abort"
incremental = false
codegen-units = 1
